<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">

<title>Ledger – Expense Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#0f1b2d;
  --panel:#16263d;
  --panel2:#1c3050;
  --line:#2c4263;
  --text:#f2eee4;
  --muted:#9fb0c8;
  --brass:#c9a45c;
  --brass2:#e2c88f;
  --danger:#e08a7a;

  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --sans:'Manrope',-apple-system,'Segoe UI',Roboto,sans-serif;
}

*{
  box-sizing:border-box;
  margin:0;
}

html{
  background:var(--ink);
  color:var(--text);
  font-family:var(--sans);
  -webkit-text-size-adjust:100%;
}

body{
  min-height:100vh;
  padding:env(safe-area-inset-top) 18px calc(env(safe-area-inset-bottom) + 40px);
  background:
    radial-gradient(
      900px 400px at 50% -120px,
      #1b3358 0%,
      transparent 70%
    ),
    var(--ink);
}

main{
  max-width:680px;
  margin:0 auto;
}

button,
input,
select{
  font:inherit;
  color:inherit;
}

button{
  cursor:pointer;
  background:none;
  border:0;
}

:focus-visible{
  outline:2px solid var(--brass);
  outline-offset:2px;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 0 8px;
}

header h1{
  font:600 26px/1 var(--serif);
  letter-spacing:.02em;
  color:var(--brass2);
}

.nav{
  display:flex;
  align-items:center;
  gap:6px;
}

.nav button{
  width:36px;
  height:36px;
  border-radius:50%;
  border:1px solid var(--line);
  font-size:18px;
  color:var(--muted);
}

.nav button:disabled{
  opacity:.3;
  cursor:default;
}

.nav span{
  min-width:128px;
  text-align:center;
  font-weight:500;
  font-size:15px;
}

.hero{
  margin:18px 0 22px;
  padding:28px 24px 24px;
  border:1px solid var(--brass);
  border-radius:6px 22px 6px 22px;
  background:linear-gradient(160deg,var(--panel2),var(--panel));
}

.hero .lbl{
  color:var(--muted);
  font-size:14px;
}

.hero .total{
  font:700 clamp(44px,13vw,68px)/1.05 var(--serif);
  margin:6px 0 14px;
  font-variant-numeric:lining-nums;
  color:var(--text);
}

.hero .meta{
  display:flex;
  gap:28px;
  color:var(--muted);
  font-size:14px;
}

.hero .meta b{
  display:block;
  color:var(--text);
  font-weight:600;
  font-size:16px;
  margin-top:2px;
}

section{
  margin-bottom:26px;
}

h2{
  font:600 22px/1 var(--serif);
  margin-bottom:12px;
  color:var(--brass2);
}

.panel{
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel);
}

.cat{
  padding:13px 16px;
  border-bottom:1px solid var(--line);
}

.cat:last-child{
  border:0;
}

.cat .row{
  display:flex;
  justify-content:space-between;
  font-size:15px;
  margin-bottom:8px;
}

.cat .row span:last-child{
  font-weight:600;
}

.cat .row small{
  color:var(--muted);
  margin-left:8px;
  font-weight:400;
}

.bar{
  height:6px;
  border-radius:3px;
  background:var(--ink);
  overflow:hidden;
}

.bar i{
  display:block;
  height:100%;
  background:linear-gradient(
    90deg,
    var(--brass),
    var(--brass2)
  );
  border-radius:3px;
  transition:width .5s ease;
}

.day{
  padding:10px 16px 4px;
  color:var(--muted);
  font-size:13px;
  background:var(--panel2);
  border-bottom:1px solid var(--line);
}

.day:first-child{
  border-radius:12px 12px 0 0;
}

.item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 16px;
  border-bottom:1px solid var(--line);
}

.item:last-child{
  border:0;
}

.item .what{
  flex:1;
  min-width:0;
}

.item .what b{
  font-weight:600;
  font-size:15px;
}

.item .what p{
  color:var(--muted);
  font-size:13px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.item .amt{
  font-weight:600;
  font-variant-numeric:tabular-nums;
}

.item .del{
  color:var(--muted);
  font-size:20px;
  line-height:1;
  padding:4px 6px;
  border-radius:6px;
}

.item .del:hover{
  color:var(--danger);
}

.empty{
  padding:28px 20px;
  text-align:center;
  color:var(--muted);
  font-size:15px;
  line-height:1.5;
}

details{
  border:1px solid var(--line);
  border-radius:12px;
  background:var(--panel);
}

summary{
  padding:14px 16px;
  cursor:pointer;
  font-weight:600;
  list-style:none;
}

summary::-webkit-details-marker{
  display:none;
}

summary::after{
  content:'+';
  float:right;
  color:var(--brass);
}

details[open] summary::after{
  content:'–';
}

form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:0 16px 16px;
}

form label{
  display:flex;
  flex-direction:column;
  gap:6px;
  font-size:13px;
  color:var(--muted);
}

form .wide{
  grid-column:1/-1;
}

input,
select{
  background:var(--ink);
  border:1px solid var(--line);
  border-radius:8px;
  padding:11px 12px;
  font-size:16px;
  color:var(--text);
  width:100%;
}

.btn{
  background:var(--brass);
  color:var(--ink);
  font-weight:600;
  border-radius:8px;
  padding:12px 16px;
}

.tools{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:14px;
}

.tools button,
.tools label{
  border:1px solid var(--line);
  border-radius:8px;
  padding:10px 14px;
  font-size:14px;
  color:var(--muted);
  cursor:pointer;
}

.tools button:hover,
.tools label:hover{
  border-color:var(--brass);
  color:var(--text);
}

.note{
  margin-top:16px;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}

#toast{
  position:fixed;
  left:50%;
  bottom:calc(env(safe-area-inset-bottom) + 22px);
  transform:translate(-50%,30px);
  opacity:0;
  background:var(--brass);
  color:var(--ink);
  padding:12px 18px;
  border-radius:999px;
  font-weight:600;
  font-size:14px;
  pointer-events:none;
  transition:.3s;
  max-width:90vw;
  text-align:center;
}

#toast.on{
  opacity:1;
  transform:translate(-50%,0);
}

@media (prefers-reduced-motion:reduce){
  *{
    transition:none!important;
  }
}
</style>
</head>

<body>

<main>

<header>

<h1>Ledger</h1>

<div class="nav">

<button id="prev" aria-label="Previous month">‹</button>

<span id="month"></span>

<button id="next" aria-label="Next month">›</button>

</div>

</header>


<div class="hero">

<div class="lbl">
Spent this month
</div>

<div class="total" id="total">
₹0
</div>

<div class="meta">

<div>
Entries
<b id="count">0</b>
</div>

<div>
Daily average
<b id="avg">₹0</b>
</div>

<div>
Top category
<b id="top">–</b>
</div>

</div>

</div>


<section>

<h2>By category</h2>

<div class="panel" id="cats"></div>

</section>


<section>

<h2>Transactions</h2>

<div class="panel" id="list"></div>

</section>


<section>

<details>

<summary>
Add an expense by hand
</summary>

<form id="form">

<label>
Amount
<input
id="f-amt"
type="number"
inputmode="decimal"
step="0.01"
min="0.01"
required>
</label>

<label>
Date
<input
id="f-date"
type="date"
required>
</label>

<label class="wide">
Category
<select id="f-cat"></select>
</label>

<label class="wide">
Note
<input
id="f-note"
type="text"
maxlength="120"
placeholder="Optional">
</label>

<button
class="btn wide"
type="submit">
Save expense
</button>

</form>

</details>


<div class="tools">

<button id="csv">
Export CSV
</button>

<button id="bak">
Back up data
</button>

<label>
Restore backup
<input
id="rst"
type="file"
accept=".json,application/json"
hidden>
</label>

</div>

<p class="note">
Data is stored online so the Shortcut and Home Screen app share the same expenses.
</p>

</section>

</main>


<div id="toast"
role="status"
aria-live="polite">
</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================================================
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  'https://ncelszjpdefuioalsfkq.supabase.co';

const SUPABASE_ANON_KEY =
  'sb_publishable_Kii1fe0MpF42FANnOj3AHA_J3wR-1jT';

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   APP SETTINGS
   ========================================================= */

const CURRENCY='INR';

const LOCALE='en-IN';

const CATS=[
  'Food',
  'Groceries',
  'Transport',
  'Bills',
  'Shopping',
  'Other'
];


const $=s=>document.querySelector(s);


const money=n=>
  new Intl.NumberFormat(
    LOCALE,
    {
      style:'currency',
      currency:CURRENCY,
      minimumFractionDigits:0,
      maximumFractionDigits:2
    }
  ).format(n);


const pad=n=>
  String(n).padStart(2,'0');


const today=()=>{

  const d=new Date();

  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

};


const esc=s=>
  String(s||'').replace(
    /[&<>"']/g,
    c=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    }[c])
  );


/* =========================================================
   APP DATA
   ========================================================= */

let db=[];

let view=new Date();

view.setDate(1);

let tt;


/* =========================================================
   TOAST
   ========================================================= */

function toast(message){

  const t=$('#toast');

  t.textContent=message;

  t.classList.add('on');

  clearTimeout(tt);

  tt=setTimeout(
    ()=>t.classList.remove('on'),
    2800
  );

}


/* =========================================================
   LOAD ALL EXPENSES FROM SUPABASE
   ========================================================= */

async function load(){

  const {
    data,
    error
  } = await supabaseClient
    .from('expenses')
    .select('*')
    .order('expense_date',{ascending:false})
    .order('id',{ascending:false});


  if(error){

    console.error(error);

    toast('Could not load expenses');

    return [];

  }


  return data.map(e=>({

    id:String(e.id),

    amount:Number(e.amount),

    cat:e.category,

    note:e.note||'',

    date:e.expense_date

  }));

}


/* =========================================================
   ADD EXPENSE
   ========================================================= */

async function add(e){

  const {
    data,
    error
  } = await supabaseClient
    .from('expenses')
    .insert({

      amount:Math.round(e.amount*100)/100,

      category:e.cat,

      note:e.note||'',

      expense_date:e.date

    })
    .select()
    .single();


  if(error){

    console.error(error);

    toast('Could not save expense');

    return false;

  }


  db.push({

    id:String(data.id),

    amount:Number(data.amount),

    cat:data.category,

    note:data.note||'',

    date:data.expense_date

  });


  toast(
    `Saved ${money(e.amount)} · ${e.cat}`
  );


  render();

  return true;

}


/* =========================================================
   DELETE EXPENSE
   ========================================================= */

async function removeExpense(id){

  const {
    error
  } = await supabaseClient
    .from('expenses')
    .delete()
    .eq('id',id);


  if(error){

    console.error(error);

    toast('Could not delete expense');

    return;

  }


  db=db.filter(
    x=>String(x.id)!==String(id)
  );


  render();

  toast('Deleted');

}


/* =========================================================
   SHORTCUT HAND-OFF
   =========================================================

   Example:

   https://YOUR-SITE.netlify.app/
   ?amount=250
   &cat=Food
   &note=Lunch
   &date=2026-10-06

   ========================================================= */

async function ingest(){

  const p=new URLSearchParams(
    location.search
  );


  if(!p.has('amount')){

    return;

  }


  const amt=parseFloat(
    String(p.get('amount'))
      .replace(',','.')
  );


  if(!(amt>0)){

    toast('Amount missing');

    history.replaceState(
      null,
      '',
      location.pathname
    );

    return;

  }


  const c=p.get('cat');

  const d=p.get('date');


  const e={

    amount:amt,

    cat:CATS.includes(c)
      ? c
      : 'Other',

    note:(p.get('note')||'')
      .trim()
      .slice(0,120),

    date:/^\d{4}-\d{2}-\d{2}$/.test(d||'')
      ? d
      : today()

  };


  const saved=await add(e);


  if(saved){

    /*
      Remove the query parameters
      so refreshing the page doesn't
      add the same expense again.
    */

    history.replaceState(
      null,
      '',
      location.pathname
    );

  }

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

  const key=
    `${view.getFullYear()}-${pad(view.getMonth()+1)}`;


  const now=new Date();


  const isNow=
    now.getFullYear()===view.getFullYear()
    &&
    now.getMonth()===view.getMonth();


  $('#month').textContent=
    view.toLocaleDateString(
      LOCALE,
      {
        month:'long',
        year:'numeric'
      }
    );


  $('#next').disabled=isNow;


  const rows=
    db
      .filter(
        e=>e.date.startsWith(key)
      )
      .sort(
        (a,b)=>
          b.date.localeCompare(a.date)
          ||
          Number(b.id)-Number(a.id)
      );


  const total=
    rows.reduce(
      (s,e)=>s+e.amount,
      0
    );


  const days=
    isNow
      ? now.getDate()
      : new Date(
          view.getFullYear(),
          view.getMonth()+1,
          0
        ).getDate();


  const by={};


  rows.forEach(e=>{

    by[e.cat]=
      (by[e.cat]||0)
      +
      e.amount;

  });


  const sorted=
    Object.entries(by)
      .sort(
        (a,b)=>b[1]-a[1]
      );


  $('#total').textContent=
    money(total);


  $('#count').textContent=
    rows.length;


  $('#avg').textContent=
    money(
      days
        ? total/days
        : 0
    );


  $('#top').textContent=
    sorted[0]
      ? sorted[0][0]
      : '–';


  $('#cats').innerHTML=
    sorted.length

      ?

      sorted.map(
        ([c,v])=>{

          const pc=
            total
              ? Math.round(v/total*100)
              : 0;


          return `
            <div class="cat">

              <div class="row">

                <span>
                  ${esc(c)}
                  <small>${pc}%</small>
                </span>

                <span>
                  ${money(v)}
                </span>

              </div>

              <div class="bar">

                <i
                  style="width:${pc}%">
                </i>

              </div>

            </div>
          `;

        }
      ).join('')

      :

      `
        <div class="empty">
          No spending recorded for this month.
        </div>
      `;


  let last='';

  let html='';


  rows.forEach(e=>{

    if(e.date!==last){

      last=e.date;


      const d=
        new Date(
          e.date+'T00:00:00'
        );


      html+=`
        <div class="day">

          ${d.toLocaleDateString(
            LOCALE,
            {
              weekday:'long',
              day:'numeric',
              month:'long'
            }
          )}

        </div>
      `;

    }


    html+=`

      <div class="item">

        <div class="what">

          <b>
            ${esc(e.cat)}
          </b>

          ${
            e.note
              ? `<p>${esc(e.note)}</p>`
              : ''
          }

        </div>

        <span class="amt">
          ${money(e.amount)}
        </span>

        <button
          class="del"
          data-id="${e.id}"
          aria-label="Delete expense">

          ×

        </button>

      </div>

    `;

  });


  $('#list').innerHTML=
    html

      ||

    `
      <div class="empty">

        Nothing here yet.

      </div>
    `;

}


/* =========================================================
   MONTH NAVIGATION
   ========================================================= */

$('#prev').onclick=()=>{

  view.setMonth(
    view.getMonth()-1
  );

  render();

};


$('#next').onclick=()=>{

  view.setMonth(
    view.getMonth()+1
  );

  render();

};


/* =========================================================
   DELETE BUTTON
   ========================================================= */

$('#list').onclick=async e=>{

  const b=
    e.target.closest('.del');


  if(!b){

    return;

  }


  if(
    !confirm(
      'Delete this expense?'
    )
  ){

    return;

  }


  await removeExpense(
    b.dataset.id
  );

};


/* =========================================================
   MANUAL FORM
   ========================================================= */

$('#f-cat').innerHTML=
  CATS
    .map(
      c=>`<option>${c}</option>`
    )
    .join('');


$('#f-date').value=today();


$('#form').onsubmit=
  async e=>{

    e.preventDefault();


    const amount=
      parseFloat(
        $('#f-amt').value
      );


    if(!(amount>0)){

      toast('Enter a valid amount');

      return;

    }


    await add({

      amount,

      cat:$('#f-cat').value,

      note:$('#f-note').value.trim(),

      date:$('#f-date').value

    });


    e.target.reset();

    $('#f-date').value=today();

  };


/* =========================================================
   CSV EXPORT
   ========================================================= */

function download(
  name,
  type,
  text
){

  const a=
    document.createElement('a');


  a.href=
    URL.createObjectURL(
      new Blob(
        [text],
        {type}
      )
    );


  a.download=name;

  document.body.appendChild(a);

  a.click();

  a.remove();

}


$('#csv').onclick=()=>{

  const q=
    s=>`"${String(s)
      .replace(/"/g,'""')}"`;


  const lines=[

    'Date,Category,Amount,Note',

    ...db
      .slice()
      .sort(
        (a,b)=>
          a.date.localeCompare(b.date)
      )
      .map(
        e=>[
          e.date,
          e.cat,
          e.amount,
          q(e.note)
        ].join(',')
      )

  ];


  download(
    'expenses.csv',
    'text/csv',
    lines.join('\n')
  );

};


/* =========================================================
   BACKUP
   ========================================================= */

$('#bak').onclick=()=>{

  download(

    `ledger-backup-${today()}.json`,

    'application/json',

    JSON.stringify(
      db,
      null,
      2
    )

  );

};


/* =========================================================
   RESTORE
   ========================================================= */

$('#rst').onchange=
  async e=>{

    try{

      const file=
        e.target.files[0];


      const data=
        JSON.parse(
          await file.text()
        );


      if(!Array.isArray(data)){

        throw new Error();

      }


      let count=0;


      for(const x of data){

        if(
          !x
          ||
          !(x.amount>0)
          ||
          !x.date
        ){

          continue;

        }


        const {
          error
        } =
          await supabaseClient
            .from('expenses')
            .insert({

              amount:x.amount,

              category:
                CATS.includes(x.cat)
                  ? x.cat
                  : 'Other',

              note:x.note||'',

              expense_date:x.date

            });


        if(!error){

          count++;

        }

      }


      db=await load();

      render();


      toast(
        `Restored ${count} entries`
      );


    }catch(error){

      console.error(error);

      toast(
        'That file is not a valid backup'
      );

    }


    e.target.value='';

  };


/* =========================================================
   START APP
   ========================================================= */

async function start(){

  db=await load();

  render();

  await ingest();

}


start();

</script>

</body>
</html>
